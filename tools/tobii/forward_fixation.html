<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>전방 중앙 고정 표식 — 시선 재검증</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #dedede; color: #111; font-family: "Malgun Gothic", sans-serif; }
    #target { position: fixed; left: 50%; top: 50%; width: 28px; height: 28px; transform: translate(-50%, -50%); }
    #target::before, #target::after { content: ""; position: absolute; background: #111; }
    #target::before { width: 28px; height: 2px; left: 0; top: 13px; }
    #target::after { width: 2px; height: 28px; left: 13px; top: 0; }
    #instructions { position: fixed; left: 5%; right: 5%; bottom: 6%; text-align: center; line-height: 1.7; }
    button { font: inherit; padding: 10px 18px; cursor: pointer; }
    :fullscreen #instructions { display: none; }
    :fullscreen { cursor: none; }
  </style>
</head>
<body>
  <div id="target" role="img" aria-label="화면 정중앙 주시 표식"></div>
  <div id="instructions">
    <p>이 창을 <strong>65인치 주행 모니터</strong>로 옮긴 뒤 아래 버튼을 누르세요.<br>
       전방 측정 때 십자의 교점을 봅니다. 태블릿 측정 때는 실제 태블릿을 봅니다.<br>
       진행자는 다른 모니터의 터미널에서 Enter를 누릅니다. 종료: Esc.</p>
    <button id="start" type="button">전체화면 중앙 표식 표시</button>
    <p id="status" role="status"></p>
  </div>
  <script>
    document.getElementById('start').addEventListener('click', async () => {
      try {
        await document.documentElement.requestFullscreen();
      } catch {
        document.getElementById('status').textContent =
          '전체화면 전환에 실패했습니다. 브라우저에서 이 파일을 직접 열고 다시 눌러주세요.';
      }
    });
  </script>
</body>
</html>
